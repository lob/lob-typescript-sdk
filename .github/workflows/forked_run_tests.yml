name: Run Tests from Forked Repo

on:
  pull_request_target:
    types: [labeled]

jobs:
  node_tests:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'Approved')
    strategy:
      matrix:
        node: ["20", "21"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Dependencies
        run: npm install

      - name: Am I Pretty
        run: npm run pretty:check

      - name: Run Unit Tests with coverage
        run: npm run test

      - name: Run Integration Tests
        env:
          LOB_API_TEST_KEY: ${{ secrets.LOB_API_TEST_KEY }}
          LOB_API_LIVE_KEY: ${{ secrets.LOB_API_LIVE_KEY }}
        run: npm run test:integration

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          flag-name: node-${{ matrix.node }}
          parallel: true

  coveralls_finish:
    needs: node_tests
    if: ${{ always() && contains(github.event.pull_request.labels.*.name, 'Approved') }}
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
